name: Snippets

# Both jobs run bin/build.sh in the Docker image from ./Dockerfile, exactly like bin/docker-build.sh locally.
on:
  # Verify that committed snippets match the generator and the pinned provider version.
  pull_request:
  push:
    branches: [master]
  # Pick up new AWS provider releases and propose them as a pull request.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snippets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate snippets
        run: bin/docker-build.sh

      - name: Fail if generated snippets are out of date
        run: |
          if [ -n "$(git status --porcelain Snippets bin/provider)" ]; then
            git status --short Snippets bin/provider | head -50
            echo "::error::Snippets are out of date. Run bin/docker-build.sh (or bin/build.sh) and commit the result."
            exit 1
          fi

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate snippets for the latest provider
        id: build
        run: |
          bin/docker-build.sh --upgrade | tee build.log
          echo "version=$(head -1 build.log | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          rm build.log

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/aws-provider-update
          delete-branch: true
          commit-message: "Regenerate snippets for hashicorp/aws ${{ steps.build.outputs.version }}"
          title: "Regenerate snippets for hashicorp/aws ${{ steps.build.outputs.version }}"
          body: |
            Snippets regenerated by `bin/build.sh --upgrade` from the `hashicorp/aws` ${{ steps.build.outputs.version }} provider schema and docs.

            🤖 Generated by the [Snippets workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          add-paths: |
            Snippets
            bin/provider/.terraform.lock.hcl
